// Mapmodel configuration file for :  nobiax_tropical_plants/palm_tree

objload palm_tree.obj
objskin palm_tree_trunk trunk_diffus.jpg trunk_specular.jpg
objbumpmap palm_tree_trunk trunk_normal.jpg

objskin palm_tree_leafs leaf_diffus.png leaf_specular.jpg
objbumpmap palm_tree_leafs leaf_normal.jpg
objalphatest palm_tree_leafs 0.28

mdlspec 0.25
mdlglow -1
mdlscale 16.50
mdlcollide 1
mdlellipsecollide 1
mdlbb 1 60
mdlyaw 90
mdlcullface 0
//mdlshadow 1

objcolor * -1
mdlwind 0.5
